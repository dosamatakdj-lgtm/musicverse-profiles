<title>Groups — Musicverse Profiles</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f2f8;
    color:#211c25;
}

a{
    text-decoration:none;
    color:inherit;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(17,16,20,.97);
    color:white;
    padding:17px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}

.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:2px;
    white-space:nowrap;
}

nav{
    display:flex;
    align-items:center;
    gap:22px;
}

nav a{
    color:#d9d4dc;
    font-size:14px;
}

nav a:hover{
    color:#d59be8;
}

.search{
    width:190px;
    padding:9px 14px;
    border:1px solid #403746;
    border-radius:22px;
    background:#252129;
    color:white;
    outline:none;
}

main{
    width:min(1150px,90%);
    margin:auto;
    padding:75px 0;
}

.page-heading{
    margin-bottom:40px;
}

.eyebrow{
    color:#8b55a8;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
}

h1{
    font-size:48px;
    color:#35213f;
    margin-bottom:10px;
}

.page-heading p{
    color:#766d79;
    max-width:700px;
}

.groups-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
}

.group-card{
    background:white;
    border-radius:22px;
    padding:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.07);
    transition:.2s;
}

.group-card:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 35px rgba(0,0,0,.12);
}

.group-company{
    color:#8b55a8;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase;
}

.group-card h2{
    color:#35213f;
    font-size:28px;
    margin:7px 0 14px;
}

.group-info{
    color:#6e6671;
    font-size:14px;
    line-height:1.8;
}

.group-info strong{
    color:#35213f;
}

.members{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid #eee7f1;
    color:#77707b;
    font-size:13px;
    line-height:1.7;
}

.view-button{
    display:inline-block;
    margin-top:20px;
    padding:10px 16px;
    border-radius:10px;
    background:#8b55a8;
    color:white;
    font-size:13px;
    font-weight:bold;
}

footer{
    margin-top:50px;
    background:#111014;
    color:#aaa;
    text-align:center;
    padding:30px 20px;
}

.footer-logo{
    color:white;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:8px;
}

@media(max-width:900px){

    header{
        flex-wrap:wrap;
    }

    nav{
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
    }

    .groups-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    h1{
        font-size:38px;
    }

    .groups-grid{
        grid-template-columns:1fr;
    }

    .search{
        width:150px;
    }

}

</style>
</head>

/* =========================================================
   ELEMENTS
   ========================================================= */

const groupsGrid =
    document.getElementById("groupsGrid");

const groupSearch =
    document.getElementById("groupSearch");


/* =========================================================
   RENDER GROUPS
   ========================================================= */

function renderGroups(list){

    groupsGrid.innerHTML = "";


    if(list.length === 0){

        groupsGrid.innerHTML = `

            <p style="
                grid-column:1/-1;
                text-align:center;
                color:#77707b;
                padding:40px;
            ">

                No groups found.

            </p>

        `;

        return;
    }


    list.forEach(group => {

        const card =
            document.createElement("a");


        card.className =
            "group-card";


        card.href =
            group.page;


        card.innerHTML = `

            <div class="group-company">

                ${group.company}

            </div>


            <h2>

                ${group.name}

            </h2>


            <div class="group-info">

                <div>

                    <strong>Members:</strong>

                    ${group.members.length}

                </div>


                <div>

                    <strong>Debut:</strong>

                    ${group.debut}

                </div>


                <div>

                    <strong>Fandom:</strong>

                    ${group.fandom}

                </div>

            </div>


            <div class="members">

                ${group.members.join(" · ")}

            </div>


            <span class="view-button">

                View Profile →

            </span>

        `;


        groupsGrid.appendChild(card);

    });

}


/* =========================================================
   SEARCH
   ========================================================= */

function searchGroups(){

    const query =
        groupSearch.value
            .toLowerCase()
            .trim();


    const filtered =
        MUSICVERSE_GROUPS.filter(group =>

            group.name
                .toLowerCase()
                .includes(query)

            ||

            group.company
                .toLowerCase()
                .includes(query)

            ||

            group.members.some(member =>

                member
                    .toLowerCase()
                    .includes(query)

            )

        );


    renderGroups(filtered);

}


groupSearch.addEventListener(
    "input",
    searchGroups
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderGroups(MUSICVERSE_GROUPS);
