<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Groups — Musicverse Profiles</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
    font-size:24px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}

nav a:hover{
    color:#aaa;
}

.hero{
    background:linear-gradient(135deg,#111,#333);
    color:white;
    padding:70px 20px;
    text-align:center;
}

.hero h2{
    font-size:55px;
    margin:0 0 10px;
}

.hero p{
    font-size:18px;
    color:#ccc;
}

.container{
    max-width:1200px;
    margin:50px auto;
    padding:0 20px;
}

.groups-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:30px;
}

.group-card{
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    transition:0.3s;
    position:relative;
}

.group-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.group-card h3{
    font-size:30px;
    margin:0 0 10px;
}

.group-card p{
    color:#666;
    line-height:1.6;
}

.group-card a{
    display:inline-block;
    margin-top:15px;
    padding:12px 20px;
    background:#111;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

.group-card a:hover{
    background:#333;
}

.tag{
    display:inline-block;
    background:#eee;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:15px;
}

footer{
    margin-top:80px;
    background:#111;
    color:#aaa;
    text-align:center;
    padding:30px;
}

@media(max-width:800px){
    .groups-grid{
        grid-template-columns:1fr;
    }

    header{
        padding:20px;
        flex-direction:column;
        gap:15px;
    }

    nav a{
        margin:0 8px;
    }

    .hero h2{
        font-size:40px;
    }
}
</style>
</head>

<body>

<header>

<h1>MUSICVERSE PROFILES</h1>

<nav>
<a href="index.html">Home</a>
<a href="groups.html">Groups</a>
<a href="idols.html">Idols</a>
<a href="#">Companies</a>
<a href="#">Rankings</a>
</nav>

</header>


<section class="hero">

<h2>GROUPS</h2>

<p>Explore every group in the Musicverse</p>

</section>


<div class="container">

<div class="groups-grid" id="groupsGrid"></div>

</div>


<footer>

Musicverse Profiles © 2026

</footer>


<script src="data.js"></script>

<script>

const groupsGrid = document.getElementById("groupsGrid");


MUSICVERSE_GROUPS.forEach(group => {

    const card = document.createElement("div");

    card.className = "group-card";

    card.innerHTML = `

        <span class="tag">
            ${group.company}
        </span>

        <h3>
            ${group.name}
        </h3>

        <p>
            ${group.members.length}-member girl group under
            ${group.company}.
            Debuted with <b>“${group.debut}”</b>.
        </p>

        <p>
            <b>Members:</b>
            ${group.members.join(", ")}
        </p>

        <a href="${group.page}">
            View Group →
        </a>

    `;

    groupsGrid.appendChild(card);

});

</script>

</body>
</html>
