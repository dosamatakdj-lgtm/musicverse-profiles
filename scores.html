<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musicverse Scores</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
    color: #171717;
}

header {
    height: 74px;
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 45px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

nav {
    display: flex;
    align-items: center;
    gap: 27px;
}

nav a {
    text-decoration: none;
    color: #222;
    font-size: 14px;
    font-weight: 600;
}

nav a:hover {
    color: #777;
}

.header-search input {
    width: 190px;
    padding: 9px 13px;
    border: 1px solid #ddd;
    border-radius: 20px;
    outline: none;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 55px 30px 80px;
}

.page-title {
    text-align: center;
    margin-bottom: 10px;
    font-size: 42px;
    font-weight: 800;
}

.page-subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 55px;
}

.section {
    margin-bottom: 65px;
}

.section-title {
    font-size: 27px;
    margin-bottom: 22px;
    font-weight: 800;
}

.card {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 18px;
    overflow: hidden;
}

.ranking-row {
    display: grid;
    grid-template-columns: 60px 1fr 180px 100px;
    align-items: center;
    min-height: 67px;
    padding: 0 25px;
    border-bottom: 1px solid #eee;
}

.ranking-row:last-child {
    border-bottom: none;
}

.rank {
    font-size: 18px;
    font-weight: 800;
    color: #888;
}

.idol-name {
    font-weight: 700;
    font-size: 16px;
}

.group-name {
    color: #888;
    font-size: 13px;
}

.score {
    text-align: right;
    font-weight: 800;
}

.level {
    text-align: right;
    font-weight: 700;
}

.group-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.group-card {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 18px;
    padding: 24px;
}

.group-card h3 {
    margin: 0 0 5px;
    font-size: 21px;
}

.group-company {
    color: #888;
    font-size: 13px;
    margin-bottom: 20px;
}

.group-member {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid #eee;
}

.group-member:last-child {
    border-bottom: none;
}

.member-left {
    display: flex;
    gap: 12px;
    align-items: center;
}

.member-rank {
    width: 25px;
    color: #999;
    font-weight: 700;
}

.member-score {
    font-weight: 800;
}

.empty-message {
    padding: 30px;
    text-align: center;
    color: #888;
}

footer {
    background: #111;
    color: white;
    padding: 35px 45px;
}

.footer-inner {
    max-width: 1250px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.footer-links {
    display: flex;
    gap: 20px;
}

.footer-links a {
    color: white;
    text-decoration: none;
    font-size: 13px;
}

@media (max-width: 800px) {
    header {
        padding: 0 20px;
    }

    nav {
        gap: 12px;
    }

    .header-search {
        display: none;
    }

    .group-grid {
        grid-template-columns: 1fr;
    }

    .ranking-row {
        grid-template-columns: 40px 1fr 100px;
    }

    .ranking-row .level {
        display: none;
    }

    .footer-inner {
        flex-direction: column;
        gap: 20px;
    }
}
</style>
</head>

<body>

<header id="67wvm4">
    <div class="logo">MUSICVERSE PROFILES</div>

    <nav>
        <a href="inditex.html">Home</a>
        <a href="groups.html">Groups</a>
        <a href="idols.html">Idols</a>
        <a href="#">Companies</a>
        <a href="scores.html">Scores</a>

        <div class="header-search">
            <input id="search" type="search" placeholder="Search Musicverse...">
        </div>
    </nav>
</header>


<main>

    <h1 class="page-title">Musicverse Scores</h1>
    <p class="page-subtitle">

    <!-- =====================================================
         GLOBAL TOP 10

    <section class="section">

    <!-- =====================================================

    <!-- =====================================================
         VOCAL GLOBAL

    <section class="section">

        <div class="card" id="vocalRanking"></div>

    </section>


    <!-- =====================================================
         RAP GLOBAL
         ===================================================== -->

    <section class="section">

        <h2 class="section-title">🎤 RAP — GLOBAL</h2>

        <div class="card" id="rapRanking"></div>

    </section>


    <!-- =====================================================
         DANCE GLOBAL
         ===================================================== -->

    <section class="section">

    </section>


    <!-- =====================================================

    <section class="section">

        <div class="card" id="stageRanking"></div>

    </section>

</main>


<footer>

    <div class="footer-inner">

        <div>
            © Musicverse Profiles
        </div>

        <div class="footer-links">
            <a href="inditex.html">Home</a>
            <a href="groups.html">Groups</a>
            <a href="idols.html">Idols</a>
            <a href="scores.html">Scores</a>
        </div>

    </div>

</footer>


<script src="data.js"></script>

/* =========================================================
   CATEGORY SCORES
   =========================================================

   Añadimos aquí las categorías en el mismo formato
   utilizado por Musicverse.

   VOCAL:
   F, F+, E-, E, E+, D-, D, D+, C-, C, C+, B-, B, B+, A-, A, S

   RAP:
   Low N.R / Mid N.R / Upper N.R / High N.R
   Low T6 / Mid T6 / High T6
   Low T5 / Mid T5 / High T5
   Low T4 / Mid T4 / High T4
   Low T3 / Mid T3 / High T3
   Low T2 / Mid T2 / High T2
   T1

   DANCE:
   1 - 10

   STAGE:
   5 - 20
*/


const CATEGORY_SCORES = {

    /*
     * DICE
     */

    Sunhye: {
        vocal: "D+",
        rap: "High T2",
        dance: 9.50,
        stage: 19
    },

    Jiana: {
        vocal: "D-",
        rap: "Low T2",
        dance: 8.70,
        stage: 18
    },

    Koko: {
        vocal: "E",
        rap: "Low T5",
        dance: 8.90,
        stage: 17
    },

    Jungeun: {
        vocal: "C+",
        rap: "Mid N.R",
        dance: 9.00,
        stage: 20
    },

    Doeun: {
        vocal: "E+",
        rap: "T1",
        dance: 8.90,
        stage: 19
    },

    Jieun: {
        vocal: "D+",
        rap: "High T3",
        dance: 9.40,
        stage: 20
    },


    /*
     * EUPHORIA
     */

    Annie: {
        vocal: "F+",
        rap: "High T4",
        dance: 5.85,
        stage: 14
    },

    Bailey: {
        vocal: "E+",
        rap: "Upper N.R",
        dance: 10.00,
        stage: 20
    },

    Moka: {
        vocal: "E+",
        rap: "Low N.R",
        dance: 8.20,
        stage: 18
    },

    Youngseo: {
        vocal: "F+",
        rap: "High N.R",
        dance: 8.90,
        stage: 20
    },

    Marquise: {
        vocal: "C-",
        rap: "High N.R",
        dance: 9.40,
        stage: 19
    }

};


/* =========================================================
   VOCAL ORDER
   ========================================================= */

const VOCAL_ORDER = [
    "S",
    "A",
    "A-",
    "B+",
    "B",
    "B-",
    "C+",
    "C",
    "C-",
    "D+",
    "D",
    "D-",
    "E+",
    "E",
    "E-",
    "F+",
    "F"
];


/* =========================================================
   RAP ORDER
   ========================================================= */

const RAP_ORDER = [
    "T1",
    "High T2",
    "Mid T2",
    "Low T2",
    "High T3",
    "Mid T3",
    "Low T3",
    "High T4",
    "Mid T4",
    "Low T4",
    "High T5",
    "Mid T5",
    "Low T5",
    "High T6",
    "Mid T6",
    "Low T6",
    "High N.R",
    "Upper N.R",
    "Mid N.R",
    "Low N.R"
];


/* =========================================================
   HELPER
   ========================================================= */

function getIdol(name) {

    return MUSICVERSE_IDOLS.find(idol => idol.name === name);

}


function getGroup(name) {

    const idol = getIdol(name);

    return idol ? idol.group : "—";

}


/* =========================================================
   GLOBAL TOP 10
   ========================================================= */

function renderGlobalTop10() {

    const container = document.getElementById("globalTop10");

    const ranking = Object.entries(OVERALL_SCORES)
        .map(([name, score]) => ({
            name,
            score,
            group: getGroup(name)
        }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);

    container.innerHTML = ranking.map((idol, index) => `

        <div class="ranking-row">

            <div class="rank">${index + 1}</div>

            <div>
                <div class="idol-name">${idol.name}</div>
                <div class="group-name">${idol.group}</div>
            </div>

            <div></div>

            <div class="score">
                ${idol.score.toFixed(2)}
            </div>

        </div>

    `).join("");

}


/* =========================================================
   GROUP SCORES
   ========================================================= */

function renderGroupScores() {

    const container = document.getElementById("groupScores");

    container.innerHTML = "";

    MUSICVERSE_GROUPS.forEach(group => {

        const members = group.members
            .filter(name => OVERALL_SCORES[name] !== undefined)
            .map(name => ({
                name,
                score: OVERALL_SCORES[name]
            }))
            .sort((a, b) => b.score - a.score);

        if (!members.length) return;

        const card = document.createElement("div");

        card.className = "group-card";

        card.innerHTML = `
            <h3>${group.name}</h3>
            <div class="group-company">${group.company}</div>
        `;

        members.forEach((member, index) => {

            card.innerHTML += `

                <div class="group-member">

                    <div class="member-left">

                        <div class="member-rank">
                            ${index + 1}
                        </div>

                        <div>
                            <div class="idol-name">
                                ${member.name}
                            </div>
                        </div>

                    </div>

                    <div class="member-score">
                        ${member.score.toFixed(2)}
                    </div>

                </div>

            `;

        });

        container.appendChild(card);

    });

}


/* =========================================================
   VOCAL GLOBAL
   ========================================================= */

function renderVocalRanking() {

    const container = document.getElementById("vocalRanking");

    const ranking = Object.entries(CATEGORY_SCORES)
        .filter(([name, data]) => data.vocal)
        .map(([name, data]) => ({
            name,
            group: getGroup(name),
            value: data.vocal,
            order: VOCAL_ORDER.indexOf(data.vocal)
        }))
        .sort((a, b) => a.order - b.order);

    renderCategory(container, ranking);

}


/* =========================================================
   RAP GLOBAL
   ========================================================= */

function renderRapRanking() {

    const container = document.getElementById("rapRanking");

    const ranking = Object.entries(CATEGORY_SCORES)
        .filter(([name, data]) => data.rap)
        .map(([name, data]) => ({
            name,
            group: getGroup(name),
            value: data.rap,
            order: RAP_ORDER.indexOf(data.rap)
        }))
        .sort((a, b) => a.order - b.order);

    renderCategory(container, ranking);

}


/* =========================================================
   DANCE GLOBAL
   ========================================================= */

function renderDanceRanking() {

    const container = document.getElementById("danceRanking");

    const ranking = Object.entries(CATEGORY_SCORES)
        .filter(([name, data]) => data.dance !== undefined)
        .map(([name, data]) => ({
            name,
            group: getGroup(name),
            value: data.dance
        }))
        .sort((a, b) => b.value - a.value);

    renderCategory(container, ranking);

}


/* =========================================================
   STAGE PRESENCE GLOBAL
   ========================================================= */

function renderStageRanking() {

    const container = document.getElementById("stageRanking");

    const ranking = Object.entries(CATEGORY_SCORES)
        .filter(([name, data]) => data.stage !== undefined)
        .map(([name, data]) => ({
            name,
            group: getGroup(name),
            value: data.stage
        }))
        .sort((a, b) => b.value - a.value);

    renderCategory(container, ranking);

}


/* =========================================================
   CATEGORY RENDERER
   ========================================================= */

function renderCategory(container, ranking) {

    if (!ranking.length) {

        container.innerHTML = `
            <div class="empty-message">
                No category scores available.
            </div>
        `;

        return;
    }

    container.innerHTML = ranking.map((idol, index) => `

        <div class="ranking-row">

            <div class="rank">
                ${index + 1}
            </div>

            <div>
                <div class="idol-name">
                    ${idol.name}
                </div>

                <div class="group-name">
                    ${idol.group}
                </div>
            </div>

            <div></div>

            <div class="level">
                ${idol.value}
            </div>

        </div>

    `).join("");

}


/* =========================================================
   START
   ========================================================= */

renderGlobalTop10();
renderGroupScores();
renderVocalRanking();
renderRapRanking();
renderDanceRanking();
renderStageRanking();

</script>
