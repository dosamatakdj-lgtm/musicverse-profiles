<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soojin — Musicverse</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
}

.profile {
    text-align: center;
}

.profile img {
    width: 280px;
    height: 360px;
    object-fit: cover;
    border-radius: 20px;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 40px;
}

.stat {
    background: #151515;
    padding: 25px;
    border-radius: 15px;
}

.stat h3 {
    color: #aaa;
    margin-top: 0;
}

.stat p {
    font-size: 24px;
    margin-bottom: 0;
}

.info {
    margin-top: 35px;
    background: #111;
    padding: 25px;
    border-radius: 15px;
}

.back {
    display: inline-block;
    margin-top: 30px;
    color: white;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<div class="profile">
    <img src="soojin.jpg">
    <h1>Soojin</h1>
    <p class="subtitle">TWOON · NOVA Entertainment</p>
</div>

<div class="info">
    <h2>Positions</h2>
    <p>Main Dancer · Lead Vocalist · Visual</p>
</div>

<div class="stats">

<div class="stat">
    <h3>Vocal</h3>
    <p>A</p>
</div>

<div class="stat">
    <h3>Rap</h3>
    <p>B</p>
</div>

<div class="stat">
    <h3>Dance</h3>
    <p>S+</p>
</div>

</div>

<a class="back" href="twoon.html">← Back to TWOON</a>

</div>

</body>
</html>
