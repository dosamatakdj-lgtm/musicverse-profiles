<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Idols — Musicverse Profiles</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
    font-size:24px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}

nav a:hover{
    color:#aaa;
}

.hero{
    background:linear-gradient(135deg,#111,#333);
    color:white;
    padding:70px 20px;
    text-align:center;
}

.hero h2{
    font-size:55px;
    margin:0 0 10px;
}

.hero p{
    color:#ccc;
    font-size:18px;
}

.controls{
    max-width:1200px;
    margin:40px auto 20px;
    padding:0 20px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.controls input,
.controls select{
    padding:14px 18px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    background:white;
}

.controls input{
    flex:1;
    min-width:250px;
}

.container{
    max-width:1200px;
    margin:20px auto;
    padding:0 20px;
}

.idols-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:25px;
}

.idol-card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
    transition:0.3s;
}

.idol-card:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.idol-card img{
    width:100%;
    height:300px;
    object-fit:cover;
    object-position:center;
    display:block;
}

.idol-info{
    padding:18px;
}

.idol-info h3{
    margin:0 0 7px;
    font-size:22px;
}

.idol-info p{
    margin:5px 0;
    color:#666;
    font-size:14px;
}

.idol-info a{
    display:block;
    margin-top:14px;
    background:#111;
    color:white;
    text-align:center;
    padding:10px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.idol-info a:hover{
    background:#333;
}

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:40px 0;
}

.pagination button{
    border:none;
    background:#111;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.pagination button:disabled{
    background:#ccc;
    cursor:not-allowed;
}

#pageInfo{
    font-weight:bold;
}

footer{
    background:#111;
    color:#aaa;
    text-align:center;
    padding:30px;
    margin-top:60px;
}

@media(max-width:1100px){
    .idols-grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:850px){
    .idols-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    .idols-grid{
        grid-template-columns:repeat(2,1fr);
    }

    header{
        padding:20px;
        flex-direction:column;
        gap:15px;
    }

    nav a{
        margin:0 8px;
    }

    .hero h2{
        font-size:40px;
    }
}

@media(max-width:450px){
    .idols-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>


<body>

<h1>MUSICVERSE PROFILES</h1>

<nav>
<a href="index.html">Home</a>
<a href="groups.html">Groups</a>

<a href="#">Companies</a>

const grid = document.getElementById("idolsGrid");
const search = document.getElementById("search");
const groupFilter = document.getElementById("groupFilter");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const pageInfo = document.getElementById("pageInfo");

let currentPage = 1;

const itemsPerPage = 10;


function getFilteredIdols(){

    const searchText =
        search.value.toLowerCase().trim();

    const selectedGroup =
        groupFilter.value;

    return idols.filter(idol => {

        const matchesSearch =
            idol.name.toLowerCase().includes(searchText);

        const matchesGroup =
            selectedGroup === "all" ||
            idol.group === selectedGroup;

        return matchesSearch && matchesGroup;

    });

}


function renderIdols(){

    const filtered = getFilteredIdols();

    const totalPages =
        Math.max(1,Math.ceil(filtered.length / itemsPerPage));

    if(currentPage > totalPages){
        currentPage = totalPages;
    }

    const start =
        (currentPage - 1) * itemsPerPage;

    const end =
        start + itemsPerPage;

    const pageItems =
        filtered.slice(start,end);


    grid.innerHTML = "";


    if(pageItems.length === 0){

        grid.innerHTML = `
            <p style="grid-column:1/-1;text-align:center;padding:50px;">
                No idols found.
            </p>
        `;

    }else{

        pageItems.forEach(idol => {

            grid.innerHTML += `

                <div class="idol-card">

                    <img
                        src="${idol.image}"
                        alt="${idol.name}"
                    >

                    <div class="idol-info">

                        <h3>${idol.name}</h3>

                        <p>${idol.group}</p>

                        <p>${idol.company}</p>

                        <a href="${idol.link}">
                            View Profile →
                        </a>

                    </div>

                </div>

            `;

        });

    }


    pageInfo.textContent =
        `Page ${currentPage} of ${totalPages}`;

    prevBtn.disabled =
        currentPage === 1;

    nextBtn.disabled =
        currentPage === totalPages;

}


prevBtn.addEventListener("click",() => {

    if(currentPage > 1){

        currentPage--;

        renderIdols();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

});


nextBtn.addEventListener("click",() => {

    const totalPages =
        Math.ceil(
            getFilteredIdols().length /
            itemsPerPage
        );

    if(currentPage < totalPages){

        currentPage++;

        renderIdols();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

});


search.addEventListener("input",() => {

    currentPage = 1;

    renderIdols();

});


groupFilter.addEventListener("change",() => {

    currentPage = 1;

    renderIdols();

});


renderIdols();

</script>
