<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idols — Musicverse Profiles</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f2f8;
    color:#211c25;
}

a{
    text-decoration:none;
    color:inherit;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(17,16,20,.97);
    color:white;
    padding:17px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:2px;
}

nav{
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
}

nav a{
    color:#d9d4dc;
    font-size:14px;
}

nav a:hover{
    color:#d59be8;
}

main{
    width:min(1200px,90%);
    margin:auto;
    padding:70px 0;
}

.heading{
    margin-bottom:35px;
}

.eyebrow{
    color:#8b55a8;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
}

h1{
    font-size:48px;
    color:#35213f;
    margin-bottom:10px;
}

.heading p{
    color:#766d79;
}

.filters{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr;
    gap:15px;
    margin-bottom:35px;
}

.filters input,
.filters select{
    width:100%;
    padding:13px 15px;
    border:1px solid #ded5e2;
    border-radius:12px;
    background:white;
    color:#35213f;
    outline:none;
}

.filters input:focus,
.filters select:focus{
    border-color:#a96ac7;
}

.idol-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.idol-card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.07);
    transition:.2s;
}

.idol-card:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 35px rgba(0,0,0,.12);
}

.idol-image{
    width:100%;
    height:280px;
    object-fit:cover;
    display:block;
    background:#241a2b;
}

.idol-info{
    padding:18px;
}

.idol-info h2{
    color:#35213f;
    font-size:21px;
    margin-bottom:4px;
}

.group-name{
    color:#8b55a8;
    font-size:12px;
    font-weight:bold;
}

.company-name{
    color:#817782;
    font-size:12px;
    margin-top:5px;
}

.positions{
    color:#6e6671;
    font-size:12px;
    line-height:1.5;
    margin-top:10px;
}

.results{
    color:#77707b;
    font-size:13px;
    margin-bottom:18px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#77707b;
    background:white;
    border-radius:20px;
}

footer{
    margin-top:60px;
    background:#111014;
    color:#aaa;
    text-align:center;
    padding:30px 20px;
}

.footer-logo{
    color:white;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:8px;
}

@media(max-width:950px){

    .idol-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:650px){

    header{
        flex-wrap:wrap;
    }

    nav{
        width:100%;
        justify-content:center;
    }

    .idol-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr;
    }

}

@media(max-width:450px){

    .idol-grid{
        grid-template-columns:1fr;
    }

    h1{
        font-size:38px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">MUSICVERSE PROFILES</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="groups.html">Groups</a>
        <a href="idols.html">Idols</a>
        <a href="index.html">Companies</a>
        <a href="rankings.html">Rankings</a>
    </nav>

</header>


<main>

    <div class="heading">

        <div class="eyebrow">
            Musicverse Database
        </div>

        <h1>Idols</h1>

        <p>
            Search and explore every idol profile in the Musicverse.
        </p>

    </div>


    <div class="filters">

        <input
            id="searchInput"
            type="search"
            placeholder="Search idol..."
        >

        <select id="groupFilter">
            <option value="">All Groups</option>
        </select>

        <select id="companyFilter">
            <option value="">All Companies</option>
        </select>

    </div>


    <div class="results" id="resultsCount"></div>


    <div class="idol-grid" id="idolGrid"></div>

</main>


<footer>

    <div class="footer-logo">
        MUSICVERSE PROFILES
    </div>

    <p>
        © 2026 Musicverse Profiles · Fictional Musicverse Database
    </p>

</footer>


<script src="data.js"></script>

<script>

const idolGrid =
    document.getElementById("idolGrid");

const searchInput =
    document.getElementById("searchInput");

const groupFilter =
    document.getElementById("groupFilter");

const companyFilter =
    document.getElementById("companyFilter");

const resultsCount =
    document.getElementById("resultsCount");


/* =========================
   GROUP FILTER
   ========================= */

MUSICVERSE_GROUPS.forEach(group => {

    const option =
        document.createElement("option");

    option.value = group.name;
    option.textContent = group.name;

    groupFilter.appendChild(option);

});


/* =========================
   COMPANY FILTER
   ========================= */

const companies = [
    ...new Set(
        MUSICVERSE_IDOLS.map(idol => idol.company)
    )
];

companies.forEach(company => {

    const option =
        document.createElement("option");

    option.value = company;
    option.textContent = company;

    companyFilter.appendChild(option);

});


/* =========================
   RENDER
   ========================= */

function renderIdols(list){

    idolGrid.innerHTML = "";

    resultsCount.textContent =
        `${list.length} idol${list.length === 1 ? "" : "s"} found`;


    if(list.length === 0){

        idolGrid.innerHTML = `
            <div class="empty">
                No idols found.
            </div>
        `;

        return;
    }


    list.forEach(idol => {

        const card =
            document.createElement("a");

        card.className = "idol-card";
        card.href = idol.page;

        card.innerHTML = `

            <img
                class="idol-image"
                src="${idol.image}"
                alt="${idol.name}"
                onerror="this.style.display='none'"
            >

            <div class="idol-info">

                <h2>
                    ${idol.name}
                </h2>

                <div class="group-name">
                    ${idol.group}
                </div>

                <div class="company-name">
                    ${idol.company}
                </div>

                <div class="positions">
                    ${idol.positions}
                </div>

            </div>

        `;

        idolGrid.appendChild(card);

    });

}


/* =========================
   FILTER
   ========================= */

function filterIdols(){

    const search =
        searchInput.value.toLowerCase().trim();

    const group =
        groupFilter.value;

    const company =
        companyFilter.value;


    const filtered =
        MUSICVERSE_IDOLS.filter(idol => {

            const matchesSearch =

                idol.name.toLowerCase().includes(search) ||

                idol.group.toLowerCase().includes(search) ||

                idol.company.toLowerCase().includes(search) ||

                idol.positions.toLowerCase().includes(search);


            const matchesGroup =
                !group ||
                idol.group === group;


            const matchesCompany =
                !company ||
                idol.company === company;


            return (
                matchesSearch &&
                matchesGroup &&
                matchesCompany
            );

        });


    renderIdols(filtered);

}


searchInput.addEventListener(
    "input",
    filterIdols
);

groupFilter.addEventListener(
    "change",
    filterIdols
);

companyFilter.addEventListener(
    "change",
    filterIdols
);


/* =========================
   URL SEARCH
   ========================= */

const params =
    new URLSearchParams(window.location.search);

const urlSearch =
    params.get("search");

if(urlSearch){

    searchInput.value =
        urlSearch;

}


/* =========================
   INITIAL RENDER
   ========================= */

filterIdols();

</script>

</body>
</html>
