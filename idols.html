<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idols — Musicverse Profiles</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f3f8;
    color:#211c25;
}

/* HEADER */

header{
    background:#111014;
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    margin-left:24px;
    font-size:14px;
}

nav a:hover{
    color:#c993e8;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,#21152d,#6d3f91);
    color:white;
    padding:70px 8%;
}

.hero h1{
    font-size:52px;
    margin-bottom:10px;
}

.hero p{
    color:#eadcf1;
    font-size:17px;
}

/* CONTROLS */

.controls{
    max-width:1100px;
    margin:40px auto 25px;
    padding:0 25px;
}

.controls-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.07);
}

.controls-title{
    font-size:20px;
    font-weight:bold;
    color:#35213f;
    margin-bottom:18px;
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:12px;
}

.filters input,
.filters select{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:14px;
    background:#fff;
    color:#333;
    outline:none;
}

.filters input:focus,
.filters select:focus{
    border-color:#9b6bb4;
}

/* RESULTS */

.results{
    max-width:1100px;
    margin:0 auto 20px;
    padding:0 25px;
}

.results-text{
    color:#666;
    font-size:14px;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:20px auto;
    padding:0 25px;
}

/* IDOL GRID */

.idols-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

/* IDOL CARD */

.idol-card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.07);
    transition:transform .2s, box-shadow .2s;
}

.idol-card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

/* IMAGE */

.idol-card img{
    width:100%;
    height:310px;
    object-fit:cover;
    display:block;
}

/* INFO */

.idol-info{
    padding:20px;
}

.idol-info h3{
    font-size:23px;
    color:#35213f;
    margin-bottom:6px;
}

.group-name{
    color:#6d3f91;
    font-weight:bold;
    font-size:14px;
    margin-bottom:3px;
}

.company{
    color:#777;
    font-size:13px;
    margin-bottom:15px;
}

.positions{
    background:#f7f2fa;
    border-radius:10px;
    padding:10px;
    color:#76558c;
    font-size:12px;
    line-height:1.5;
}

.positions strong{
    display:block;
    color:#6d3f91;
    font-size:11px;
    margin-bottom:4px;
}

/* BUTTON */

.profile-button{
    display:block;
    margin-top:15px;
    background:#6d3f91;
    color:white;
    text-align:center;
    padding:11px;
    border-radius:10px;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.profile-button:hover{
    background:#512d6d;
}

/* NO RESULTS */

.no-results{
    grid-column:1/-1;
    background:white;
    border-radius:20px;
    padding:60px 20px;
    text-align:center;
    color:#777;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.no-results h3{
    color:#35213f;
    margin-bottom:8px;
    font-size:24px;
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:45px 0;
}

.pagination button{
    border:none;
    background:#6d3f91;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.pagination button:hover:not(:disabled){
    background:#512d6d;
}

.pagination button:disabled{
    background:#ccc;
    cursor:not-allowed;
}

#pageInfo{
    font-weight:bold;
    color:#35213f;
}

/* FOOTER */

footer{
    margin-top:70px;
    background:#111014;
    color:#aaa;
    text-align:center;
    padding:25px;
    font-size:13px;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .idols-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:700px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav a{
        margin:0 8px;
    }

    .hero h1{
        font-size:40px;
    }

    .idols-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .idols-grid{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">
MUSICVERSE PROFILES
</div>

<nav>
<a href="index.html">Home</a>
<a href="groups.html">Groups</a>
<a href="idols.html">Idols</a>
<a href="index.html">Companies</a>
<a href="index.html">Rankings</a>
</nav>

</header>


<section class="hero">

<h1>IDOLS</h1>

<p>Explore every idol in the Musicverse.</p>

</section>


<!-- FILTERS -->

<div class="controls">

<div class="controls-box">

<div class="controls-title">
Find an Idol
</div>

<div class="filters">

<input
    type="text"
    id="search"
    placeholder="Search an idol..."
>

<select id="groupFilter">

    <option value="all">
        All Groups
    </option>

</select>

<select id="companyFilter">

    <option value="all">
        All Companies
    </option>

</select>

<select id="positionFilter">

    <option value="all">
        All Positions
    </option>

</select>

</div>

</div>

</div>


<!-- RESULTS -->

<div class="results">

<p class="results-text" id="resultsText"></p>

</div>


<!-- IDOLS -->

<div class="container">

<div class="idols-grid" id="idolsGrid"></div>


<div class="pagination">

<button id="prevBtn">
← Previous
</button>

<span id="pageInfo"></span>

<button id="nextBtn">
Next →
</button>

</div>

</div>


<footer>

© 2026 Musicverse Profiles · Fictional Musicverse Database

</footer>


<!-- DATABASE -->

<script src="data.js"></script>


<script>

/* =========================
   ELEMENTS
========================= */

const grid =
    document.getElementById("idolsGrid");

const search =
    document.getElementById("search");

const groupFilter =
    document.getElementById("groupFilter");

const companyFilter =
    document.getElementById("companyFilter");

const positionFilter =
    document.getElementById("positionFilter");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const pageInfo =
    document.getElementById("pageInfo");

const resultsText =
    document.getElementById("resultsText");


let currentPage = 1;

const itemsPerPage = 8;


/* =========================
   GROUP FILTER
========================= */

MUSICVERSE_GROUPS.forEach(group => {

    const option =
        document.createElement("option");

    option.value = group.name;

    option.textContent = group.name;

    groupFilter.appendChild(option);

});


/* =========================
   COMPANY FILTER
========================= */

const companies = [
    ...new Set(
        MUSICVERSE_IDOLS.map(
            idol => idol.company
        )
    )
];

companies.sort();

companies.forEach(company => {

    const option =
        document.createElement("option");

    option.value = company;

    option.textContent = company;

    companyFilter.appendChild(option);

});


/* =========================
   POSITION FILTER
========================= */

const positions = new Set();

MUSICVERSE_IDOLS.forEach(idol => {

    const idolPositions =
        idol.positions
            .split("·")
            .map(position => position.trim());

    idolPositions.forEach(position => {

        if(position){
            positions.add(position);
        }

    });

});

[...positions]
    .sort()
    .forEach(position => {

        const option =
            document.createElement("option");

        option.value = position;

        option.textContent = position;

        positionFilter.appendChild(option);

    });


/* =========================
   FILTER IDOLS
========================= */

function getFilteredIdols(){

    const searchText =
        search.value
            .toLowerCase()
            .trim();

    const selectedGroup =
        groupFilter.value;

    const selectedCompany =
        companyFilter.value;

    const selectedPosition =
        positionFilter.value;


    return MUSICVERSE_IDOLS.filter(idol => {

        const matchesSearch =
            idol.name
                .toLowerCase()
                .includes(searchText);


        const matchesGroup =
            selectedGroup === "all" ||
            idol.group === selectedGroup;


        const matchesCompany =
            selectedCompany === "all" ||
            idol.company === selectedCompany;


        const matchesPosition =
            selectedPosition === "all" ||
            idol.positions
                .split("·")
                .map(position => position.trim())
                .includes(selectedPosition);


        return (
            matchesSearch &&
            matchesGroup &&
            matchesCompany &&
            matchesPosition
        );

    });

}


/* =========================
   RENDER IDOLS
========================= */

function renderIdols(){

    const filtered =
        getFilteredIdols();


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filtered.length /
                itemsPerPage
            )
        );


    if(currentPage > totalPages){

        currentPage =
            totalPages;

    }


    const start =
        (currentPage - 1) *
        itemsPerPage;


    const end =
        start +
        itemsPerPage;


    const pageItems =
        filtered.slice(start,end);


    grid.innerHTML = "";


    /* RESULTS TEXT */

    resultsText.textContent =
        `${filtered.length} idol${filtered.length === 1 ? "" : "s"} found`;


    /* NO RESULTS */

    if(pageItems.length === 0){

        grid.innerHTML = `

            <div class="no-results">

                <h3>
                    No idols found
                </h3>

                <p>
                    Try changing your search or filters.
                </p>

            </div>

        `;

    }


    /* CARDS */

    else{

        pageItems.forEach(idol => {

            grid.innerHTML += `

                <div class="idol-card">

                    <img
                        src="${idol.image}"
                        alt="${idol.name}"
                    >

                    <div class="idol-info">

                        <h3>
                            ${idol.name}
                        </h3>

                        <p class="group-name">
                            ${idol.group}
                        </p>

                        <p class="company">
                            ${idol.company}
                        </p>

                        <div class="positions">

                            <strong>
                                POSITIONS
                            </strong>

                            ${idol.positions}

                        </div>

                        <a
                            class="profile-button"
                            href="${idol.page}"
                        >
                            View Profile →
                        </a>

                    </div>

                </div>

            `;

        });

    }


    /* PAGINATION */

    pageInfo.textContent =
        `Page ${currentPage} of ${totalPages}`;


    prevBtn.disabled =
        currentPage === 1;


    nextBtn.disabled =
        currentPage === totalPages;

}


/* =========================
   PREVIOUS
========================= */

prevBtn.addEventListener(
    "click",
    () => {

        if(currentPage > 1){

            currentPage--;

            renderIdols();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    }
);


/* =========================
   NEXT
========================= */

nextBtn.addEventListener(
    "click",
    () => {

        const totalPages =
            Math.ceil(
                getFilteredIdols().length /
                itemsPerPage
            );


        if(currentPage < totalPages){

            currentPage++;

            renderIdols();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    }
);


/* =========================
   SEARCH
========================= */

search.addEventListener(
    "input",
    () => {

        currentPage = 1;

        renderIdols();

    }
);


/* =========================
   GROUP
========================= */

groupFilter.addEventListener(
    "change",
    () => {

        currentPage = 1;

        renderIdols();

    }
);


/* =========================
   COMPANY
========================= */

companyFilter.addEventListener(
    "change",
    () => {

        currentPage = 1;

        renderIdols();

    }
);


/* =========================
   POSITION
========================= */

positionFilter.addEventListener(
    "change",
    () => {

        currentPage = 1;

        renderIdols();

    }
);


/* =========================
   START
========================= */

renderIdols();

</script>

</body>
</html>
